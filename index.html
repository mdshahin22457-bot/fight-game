<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fight Game</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  user-select:none;
}

h1{
  margin:15px 0 5px;
  color:#ffcc00;
}

#game{
  position:relative;
  width:100%;
  max-width:700px;
  height:400px;
  margin:auto;
  overflow:hidden;
  border:4px solid #444;
  background:linear-gradient(#55aee8 0 65%,#555 65% 100%);
}

#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:20px;
  background:#222;
}

.fighter{
  position:absolute;
  bottom:20px;
  width:65px;
  height:120px;
  border-radius:20px 20px 10px 10px;
}

#player{
  left:70px;
  background:#1976d2;
}

#enemy{
  right:70px;
  background:#d32f2f;
}

.head{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#f2b28b;
  top:-45px;
  left:9px;
}

.hpbox{
  position:absolute;
  top:15px;
  width:40%;
  height:25px;
  background:#222;
  border:2px solid white;
}

#playerBox{left:5%}
#enemyBox{right:5%}

.hp{
  height:100%;
  background:#20d64b;
}

#enemyHP{
  margin-left:auto;
}

#message{
  position:absolute;
  top:48%;
  width:100%;
  font-size:30px;
  font-weight:bold;
  text-shadow:2px 2px #000;
}

.controls{
  max-width:700px;
  margin:15px auto;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:12px;
  padding:16px 22px;
  font-size:18px;
  font-weight:bold;
  color:white;
  background:#333;
}

button:active{
  transform:scale(.92);
}

.attack{background:#e53935}
.kick{background:#fb8c00}
.block{background:#1565c0}
.restart{background:#43a047}

#info{
  font-size:14px;
  color:#bbb;
}
</style>
</head>

<body>

<h1>🥊 FIGHT GAME 🥊</h1>

<div id="game">

  <div class="hpbox" id="playerBox">
    <div class="hp" id="playerHP"></div>
  </div>

  <div class="hpbox" id="enemyBox">
    <div class="hp" id="enemyHP"></div>
  </div>

  <div id="player" class="fighter">
    <div class="head"></div>
  </div>

  <div id="enemy" class="fighter">
    <div class="head"></div>
  </div>

  <div id="message"></div>

  <div id="ground"></div>
</div>

<div class="controls">
  <button class="attack" onclick="attack(10)">👊 PUNCH</button>
  <button class="kick" onclick="attack(15)">🦵 KICK</button>
  <button class="block" onclick="block()">🛡️ BLOCK</button>
  <button class="restart" onclick="restart()">🔄 RESTART</button>
</div>

<div id="info">Enemy নিজে নিজে আক্রমণ করবে!</div>

<script>

let playerHealth = 100;
let enemyHealth = 100;
let defending = false;
let gameOver = false;

const playerHP = document.getElementById("playerHP");
const enemyHP = document.getElementById("enemyHP");
const message = document.getElementById("message");

function updateHealth(){

  playerHP.style.width = playerHealth + "%";
  enemyHP.style.width = enemyHealth + "%";

  if(enemyHealth <= 0){
    message.innerHTML = "🏆 YOU WIN!";
    gameOver = true;
  }

  if(playerHealth <= 0){
    message.innerHTML = "💥 YOU LOSE!";
    gameOver = true;
  }
}

function attack(damage){

  if(gameOver) return;

  message.innerHTML = "👊 ATTACK!";

  enemyHealth -= damage;

  if(enemyHealth < 0){
    enemyHealth = 0;
  }

  updateHealth();

  if(!gameOver){
    setTimeout(enemyAttack,700);
  }
}

function block(){

  if(gameOver) return;

  defending = true;
  message.innerHTML = "🛡️ BLOCK!";

  setTimeout(function(){
    defending = false;
    message.innerHTML = "";
  },800);
}

function enemyAttack(){

  if(gameOver) return;

  let damage = Math.floor(Math.random()*10)+5;

  if(defending){
    damage = Math.floor(damage/2);
    message.innerHTML = "🛡️ BLOCKED!";
  }else{
    message.innerHTML = "😈 ENEMY ATTACK!";
  }

  playerHealth -= damage;

  if(playerHealth < 0){
    playerHealth = 0;
  }

  updateHealth();

  setTimeout(function(){
    if(!gameOver) message.innerHTML="";
  },500);
}

function restart(){

  playerHealth = 100;
  enemyHealth = 100;
  defending = false;
  gameOver = false;

  message.innerHTML="";

  updateHealth();
}

updateHealth();

</script>

</body>
</html>
